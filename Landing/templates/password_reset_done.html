<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Password Reset Sent</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" 
          rel="stylesheet" 
          integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" 
          crossorigin="anonymous">
    
    <!-- Custom Styles -->
    <style>
        body {
            background-color: #f8f9fa;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
        }
        .card {
            border-radius: 10px;
            margin: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            border: none;
            max-width: 500px;
            width: 100%;
        }
        .card-header {
            border-radius: 10px 10px 0 0;
            padding: 1.5rem;
            background-color: #28a745;
            color: white;
            text-align: center;
        }
        .card-body {
            padding: 2rem;
            text-align: center;
        }
        .card-footer {
            border-radius: 0 0 10px 10px;
            padding: 1rem;
            background-color: #f8f9fa;
        }
        .btn-outline-primary {
            padding: 8px 20px;
            font-weight: 500;
            color: #007bff;
            border-color: #007bff;
            transition: all 0.2s ease;
        }
        .btn-outline-primary:hover {
            background-color: #007bff;
            color: white;
            border-color: #007bff;
        }
        .check-icon {
            margin-bottom: 1.5rem;
        }
        .text-muted {
            color: #6c757d !important;
        }
        a.text-primary {
            color: #007bff !important;
            text-decoration: none;
        }
        a.text-primary:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="card-header">
            <h2 class="mb-0">Password Reset Sent</h2>
        </div>
        <div class="card-body">
            <div class="check-icon">
                <!-- SVG using W3C namespace http://www.w3.org/2000/svg -->
                <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" fill="#28a745" 
                     class="bi bi-check-circle" viewBox="0 0 16 16">
                    <path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14zm0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16z"/>
                    <path d="M10.97 4.97a.235.235 0 0 0-.02.022L7.477 9.417 5.384 7.323a.75.75 0 0 0-1.06 1.06L6.97 11.03a.75.75 0 0 0 1.079-.02l3.992-4.99a.75.75 0 0 0-1.071-1.05z"/>
                </svg>
            </div>
            <p class="text-muted mb-4">
                If an account with that email exists, you will receive a password reset email shortly.
            </p>
            <p class="text-muted mb-4">
                Please check your inbox (and spam/junk folder) for an email from us.
            </p>
            <a href="{% url 'user_login' %}" class="btn btn-outline-primary">
                Return to Login
            </a>
        </div>
        <div class="card-footer text-muted text-center">
            <small>
                Didn't receive an email? 
                <a href="{% url 'password_reset' %}" class="text-primary">Try again</a>
            </small>
        </div>
    </div>

    <!-- Bootstrap JS and dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" 
            integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" 
            crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.min.js" 
            integrity="sha384-fbbOQedDUMZZ5KreZpsbe1LCZPVmfTnH7ois6mU1QK+m14rQ1l2bGBq41eYeM/fS" 
            crossorigin="anonymous"></script>
</body>
</html>
