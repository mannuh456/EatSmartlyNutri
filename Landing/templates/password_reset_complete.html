<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Password Reset Complete</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" 
          rel="stylesheet" 
          integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" 
          crossorigin="anonymous">
    
    <!-- Custom Styles -->
    <style>
        body {
            background-color: #f8f9fa;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
        }
        .card {
            border-radius: 10px;
            margin: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            border: none;
            max-width: 500px;
            width: 100%;
        }
        .card-header {
            border-radius: 10px 10px 0 0;
            padding: 1.5rem;
            background-color: #28a745;
            color: white;
        }
        .card-body {
            padding: 2rem;
        }
        .card-footer {
            border-radius: 0 0 10px 10px;
            padding: 1rem;
            background-color: #f8f9fa;
        }
        .btn-primary {
            padding: 10px 24px;
            font-weight: 500;
            background-color: #007bff;
            border-color: #007bff;
            transition: all 0.2s ease;
        }
        .btn-primary:hover {
            background-color: #0056b3;
            border-color: #0056b3;
            filter: brightness(90%);
        }
        .check-icon {
            margin-bottom: 1.5rem;
        }
        .text-muted {
            color: #6c757d !important;
        }
        a.text-primary {
            color: #007bff !important;
            text-decoration: none;
        }
        a.text-primary:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="card-header text-center">
            <h2 class="mb-0">Password Reset Complete</h2>
        </div>
        <div class="card-body text-center">
            <div class="check-icon">
                <!-- SVG from W3C namespace http://www.w3.org/2000/svg -->
                <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" fill="#28a745" 
                     class="bi bi-check-circle-fill" viewBox="0 0 16 16">
                    <path d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0zm-3.97-3.03a.75.75 0 0 0-1.08.022L7.477 9.417 5.384 7.323a.75.75 0 0 0-1.06 1.06L6.97 11.03a.75.75 0 0 0 1.079-.02l3.992-4.99a.75.75 0 0 0-.01-1.05z"/>
                </svg>
            </div>
            <p class="text-muted mb-4">
                Your password has been successfully reset!
            </p>
            <p class="mb-4">
                You can now use your new password to access your account.
            </p>
            <a href="{% url 'user_login' %}" class="btn btn-primary">
                Log In Now
            </a>
        </div>
        <div class="card-footer text-muted text-center">
            <small>
                Having trouble? 
                <a href="#" class="text-primary">Contact support</a>
            </small>
        </div>
    </div>

    <!-- Bootstrap JS and dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" 
            integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" 
            crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.min.js" 
            integrity="sha384-fbbOQedDUMZZ5KreZpsbe1LCZPVmfTnH7ois6mU1QK+m14rQ1l2bGBq41eYeM/fS" 
            crossorigin="anonymous"></script>
</body>
</html>
