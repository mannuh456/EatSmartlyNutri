{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="{% static 'assets/css/style.css' %}">
    <style>
        /* Logo Styling */
        .logo {
            text-align: center;
            padding: 20px 0;
        }

        .logo img {
            width: 100px; /* Adjust the size as needed */
            height: auto;
            border-radius: 50%; /* Optional: Makes the logo circular */
            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.2); /* Optional: Adds shadow for elegance */
        }

        .error-message {
            color: red;
            text-align: center;
            margin-bottom: 10px;
        }

        .forgot-password {
            text-align: center;
            margin-top: 10px;
        }
        
        .forgot-password a {
            color: blue;
            text-decoration: none;
        }

        .forgot-password a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <img src="{% static 'assets/img/logo.jpg' %}" alt="Logo">
        </div>

        <div class="login form">
            <header>Login</header>

            {% if form.errors %}
                <div class="error-message">
                    Invalid username or password. Please try again.
                </div>
            {% endif %}

            <form method="POST">
                {% csrf_token %}
                <div class="form-group">
                    <label for="{{ form.username.id_for_label }}">Username or Email</label>
                    {{ form.username }}
                </div>
                
                <div class="form-group">
                    <label for="{{ form.password.id_for_label }}">Password</label>
                    {{ form.password }}
                </div>

                <div class="form-group">
                    <input type="submit" class="button" value="Login">
                </div>
            </form>

            <div class="forgot-password">
                <a href="{% url 'password_reset' %}">Forgot Password?</a>
            </div>

            <div class="signup">
                <span class="signup">Don't have an account?
                   <label><a href="{% url 'register_user' %}">Sign up here</a></label>
                </span>
            </div>
        </div>
    </div>
</body>
</html>
